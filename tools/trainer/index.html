<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Эко-бизнес есептері: тренажер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: жұмыс құралы – анық, сенімді, жоғары сынып оқушысына
   IDEA: кәсіпкердің есеп дәптері: әр есеп – бизнес-кейс, шешім қадамдары – бухгалтерлік жолдар
   PICTURE: 50 есептің картасы (бөлімдер бойынша плиткалар) және қадамдық шешу парағы
   COLOUR and TYPE: терең жасыл (эко), ақ парақ, сары (ақша/табыс), қызыл (қате); Onest
   LAYOUT: сол жақта карта, оң жақта есеп парағы; телефонда карта жоғарыда */
:root{color-scheme:light dark;
--bg:light-dark(#eef4f0,#0e1814);--panel:light-dark(#ffffff,#16241e);--ink:light-dark(#13241c,#e8f1ec);--mute:light-dark(#5c6f65,#9db3a7);
--g:light-dark(#0d6a4c,#3fc48f);--g2:light-dark(#dff0e7,#1d3a2e);--gold:light-dark(#d98c00,#f5b83d);--gold2:light-dark(#fff3d6,#3a2e12);
--red:light-dark(#cf3b2b,#ff7a69);--red2:light-dark(#fde6e2,#3c1d19);--line:light-dark(#d5e2da,#2a3d34)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,"Segoe UI",Arial,sans-serif;overflow-x:clip}
button,input{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(3vw,14px)}
.top{background:var(--g);color:#fff;padding:22px 0 0}
.top .wrap{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.top h1{font-size:clamp(26px,3.4vw,40px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.top p{margin:6px 0 0;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-weight:600;white-space:nowrap}.chip b{font-size:20px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:18px}
.tabs button{flex:none;border:0;background:transparent;color:#fff;opacity:.8;font-weight:600;padding:12px 16px;min-height:46px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;margin-left:6px}
main{padding:22px 0 90px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--panel);border-radius:20px;padding:clamp(16px,2.4vw,28px);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(10,60,40,.06)}
.map{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.map h3{font-size:14px;margin:14px 0 8px;display:flex;gap:8px;align-items:center;color:var(--mute)}.map h3:first-child{margin-top:0}
.map h3 svg{flex:none}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tile{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;min-height:40px;font-weight:600;cursor:pointer;position:relative}
.tile.s3{background:var(--g);border-color:var(--g);color:#fff}.tile.s2{background:var(--g2);border-color:var(--g)}.tile.s1{background:var(--gold2);border-color:var(--gold)}
.tile.err::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.tile.cur{outline:3px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mute);margin-top:12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px;border:2px solid var(--line)}
.banner{width:100%;height:clamp(110px,16vw,170px);object-fit:cover;border-radius:14px;margin:0 0 14px;display:block}.cover{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:14px;margin:0 0 12px;display:block}
.kick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:6px}
.pill{background:var(--g2);color:var(--g);font-weight:600;border-radius:999px;padding:3px 10px}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px}
h2{font-size:clamp(24px,2.6vw,32px);line-height:1.1;margin:4px 0 14px;text-wrap:balance}
.text{font-size:18px;line-height:1.6;max-width:72ch}
.num{background:var(--gold2);border-radius:5px;padding:0 3px;font-weight:600;white-space:nowrap}
details.given{margin:14px 0;border:1px dashed var(--line);border-radius:14px;padding:4px 14px}
details.given summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--g)}
table{border-collapse:collapse;width:100%;font-size:15px;margin:4px 0 10px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}td.r,th.r{text-align:right;white-space:nowrap}
.seg{display:inline-flex;background:var(--g2);border-radius:14px;padding:4px;margin:16px 0 10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;min-height:42px}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--g);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.step{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.step::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--g2);color:var(--g);font-weight:800}
.step.ok::before{content:"✓";background:var(--g);color:#fff}.step.helped::before{background:var(--gold);color:#fff}
.step.todo{opacity:.45}
.step .lab{font-weight:600}.step .calc{color:var(--mute);font-size:15px}
.step .calc b{color:var(--ink)}
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
input.ans{width:min(240px,100%);min-height:46px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:18px;font-weight:600;background:var(--panel);color:var(--ink);text-align:right}
input.ans:focus{outline:none;border-color:var(--g)}
.btn{border:0;border-radius:12px;padding:10px 18px;min-height:46px;font-weight:600;cursor:pointer;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--g)}.btn.gold{background:var(--gold);color:#fff}
.btn:focus-visible,.tile:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fb{margin-top:8px;border-radius:12px;padding:10px 14px;font-weight:600}
.fb.no{background:var(--red2);color:var(--red)}.fb.ok{background:var(--g2);color:var(--g)}.fb.hint{background:var(--gold2);color:light-dark(#7a4f00,#f5d28c)}
.fb small{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.done{background:var(--g2);border-radius:16px;padding:16px 18px;margin-top:16px}
.done h3{margin:0 0 8px;color:var(--g)}
.sol{margin:8px 0 0;padding-left:22px}.sol li{margin:4px 0}.sol b,.calc b{white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:10px;align-items:center;margin:8px 0}
.bar .t{font-size:15px}.bar .tr{height:10px;background:var(--g2);border-radius:5px;margin-top:4px}.bar .f{height:100%;background:var(--red);border-radius:5px}
.bar .c{text-align:right;font-weight:800}
.err{border-top:1px solid var(--line);padding:12px 0}
.err .w{color:var(--red);font-weight:600}.err .fx{color:var(--g);font-weight:600}
.muted{color:var(--mute)}
.formula{font-size:clamp(17px,2vw,21px);font-weight:800;background:var(--g2);color:var(--g);border-radius:12px;padding:12px 14px;margin:10px 0}
.prog{height:10px;background:var(--g2);border-radius:5px;overflow:hidden;margin:8px 0 16px}.prog i{display:block;height:100%;background:var(--g)}
.choose{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.choose button{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 14px;min-height:44px;font-weight:600;cursor:pointer}
.choose button[aria-pressed=true]{border-color:var(--g);background:var(--g2);color:var(--g)}
.big{font-size:clamp(44px,6vw,64px);font-weight:800;line-height:1;color:var(--g)}
.scroll{overflow-x:auto}
#calcBtn{position:fixed;right:16px;bottom:16px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#calc{position:fixed;right:16px;bottom:76px;width:270px;z-index:6;background:var(--panel);border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:none}
#calc.open{display:block}
#calc input{width:100%;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:18px;text-align:right;background:var(--bg);color:var(--ink)}
#cres{text-align:right;font-size:22px;font-weight:800;color:var(--g);min-height:32px;margin:4px 0 8px;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{min-height:44px;border:0;border-radius:10px;background:var(--g2);color:var(--ink);font-weight:800;font-size:18px;cursor:pointer}
.keys button.op{background:var(--gold2)}.keys button.eqk{background:var(--g);color:#fff}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.map{position:static;max-height:none}.tiles{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}}
@media(max-width:600px){.seg{display:grid;grid-template-columns:1fr 1fr;width:100%}.seg button{padding:9px 6px}.nav .btn{flex:1 1 auto}.text{font-size:17px}.step{grid-template-columns:28px minmax(0,1fr)}.step::before{width:26px;height:26px}#calc{left:12px;right:12px;width:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <div><h1>Эко-бизнес есептері: тренажер</h1><p>Экономика негіздері · 50 практикалық есеп · қадаммен шешу және қатемен жұмыс</p></div>
 <div class="chips"><span class="chip">Шешілді <b id="cSolved">0</b>/50</span><span class="chip">Жұлдыз <b id="cStars">0</b></span><span class="chip">Түзетілмеген қате <b id="cErr">0</b></span></div>
</div><div class="wrap"><nav class="tabs" role="tablist" id="tabs">
 <button role="tab" data-v="tasks" aria-selected="true">Есептер</button>
 <button role="tab" data-v="errors">Қатемен жұмыс<span class="badge" id="tErr" hidden></span></button>
 <button role="tab" data-v="test">Сынақ</button>
 <button role="tab" data-v="formulas">Формулалар</button>
</nav></div></header>
<main><div class="wrap" id="view"></div></main>
<button class="btn gold" id="calcBtn" aria-expanded="false">Калькулятор</button>
<div id="calc" role="dialog" aria-label="Калькулятор"><input id="cin" inputmode="decimal" aria-label="Өрнек" placeholder="мысалы: 5*1200+3000"><div id="cres"></div>
<div class="keys"><button class="" data-k="7">7</button><button class="" data-k="8">8</button><button class="" data-k="9">9</button><button class="op" data-k="÷">÷</button><button class="" data-k="4">4</button><button class="" data-k="5">5</button><button class="" data-k="6">6</button><button class="op" data-k="×">×</button><button class="" data-k="1">1</button><button class="" data-k="2">2</button><button class="" data-k="3">3</button><button class="op" data-k="−">−</button><button class="" data-k="0">0</button><button class="" data-k=",">,</button><button class="op" data-k="(">(</button><button class="op" data-k="+">+</button><button class="op" data-k="C">C</button><button class="op" data-k="⌫">⌫</button><button class="op" data-k=")">)</button><button class="eqk" data-k="=">=</button></div></div>
<script>
const RAW=[{"n": 1, "title": "Қоқыс полигонының шығыны", "text": "Шырын зауыты күніне 500 кг алма қалдығын (жмых) полигонға төгеді. Әр 100 кг қалдық үшін экологиялық салық — 1 200 тг, ал жүк көлігінің жанармайына күніне 3 000 тг жұмсалады. Егер зауыт қалдықты 100% биогумусқа айналдырып, полигонға апармаса, 30 күнде қанша теңге үнемдейді?", "ans": "270 000 теңге"}, {"n": 2, "title": "Мейрамхана майынан — биоотын", "text": "Тамақтану желісі күніне 200 литр пайдаланылған фритюр майын полигонға тапсырады. Кәдеге жарату қызметі әр 50 литр үшін 2 500 тг, ал көлік шақыру күніне 4 000 тг тұрады. Майды биодизель зауыты тегін алып кетсе, желі 30 күнде қанша қаражат үнемдейді?", "ans": "420 000 теңге"}, {"n": 3, "title": "Ағаш жоңқасын жылуға айналдыру", "text": "Жиһаз цехы аптасына 1 200 кг ағаш жоңқасын полигонға шығарады. Әр 300 кг жоңқаны төгу ақысы — 1 500 тг, тасымалдау аптасына 5 000 тг. Жоңқаны пеллет жасаушылар өздері алып кетсе, цех 4 аптада қанша теңге үнемдейді?", "ans": "44 000 теңге"}, {"n": 4, "title": "Кофе қалдығынан саңырауқұлақ өсіру", "text": "Кофеханалар желісі күніне 80 кг кофе ұнтағының қалдығын шығарады. Қалдықты арнайы қоқысқа шығару құны 1 келісіне 40 тг, ал күнделікті логистикалық қызмет ақысы 1 800 тг. Қалдықты саңырауқұлақ фермасы тегін алып кетсе, 30 күндегі үнем қанша?", "ans": "150 000 теңге"}, {"n": 5, "title": "Құрылыс қалдықтарын сұрыптау", "text": "Құрылыс компаниясы күніне 4 тонна бетон сынықтарын полигонға тасиды. 1 тонна қалдықты қабылдау тарифі — 2 200 тг, жүк көлігінің бір күндік жалдау ақысы — 12 000 тг. Сынықтарды жол төсеміне қиыршық тас жасайтын цех тегін әкетсе, 20 жұмыс күнінде қанша үнем болады?", "ans": "416 000 теңге"}, {"n": 6, "title": "Супермаркеттің органикалық қалдығы", "text": "Супермаркет күніне 300 кг мерзімі өткен көкөністерді кәдеге жаратуға жібереді. Әр 100 кг үшін төлем — 1 800 тг, тасымалдау — 2 500 тг/ күн. Органиканы мал фермасы өз көлігімен тегін алып кетсе, 30 күнде қанша қаражат үнемделеді?", "ans": "237 000 теңге"}, {"n": 7, "title": "Тігін фабрикасының мата қиындылары", "text": "Тігін цехы айына 2 500 кг мата қалдығын жинайды. Полигонға тапсыру бағасы 500 кг үшін 4 000 тг, ал айына 5 рет көлік жалдау әр жолы 6 000 тг тұрады. Мата қиындыларын жиһаз толтырғыш жасайтын зауыт тегін әкетсе, айлық үнем қанша?", "ans": "50 000 теңге"}, {"n": 8, "title": "Шыны сынықтарын қайтару", "text": "Сусын зауыты аптасына 1 500 кг жарамсыз шыны ыдыстарды полигонға төгеді. Әр 500 кг үшін салық — 3 500 тг, тасымалдау аптасына 7 500 тг. Шыны зауыты сынықтарды өз көлігімен әкетіп, әр келісіне 10 тг төлесе, зауыттың 4 аптадағы жалпы экономикалық тиімділігі (үнем + табыс) қанша?", "ans": "132 000 теңге"}, {"n": 9, "title": "Картон қораптар логистикасы", "text": "Логистикалық орталық күніне 600 кг картон қалдығын жинайды. Бұрын оны полигонға апаруға 100 кг үшін 800 тг және көлікке күніне 3 200 тг төлейтін. Қазір қағаз комбинаты картонды өзі алып кетіп, 1 келісін 35 тг-ден сатып алады. 30 күндегі жалпы пайда (үнем + сату түсімі) қанша?", "ans": "870 000 теңге"}, {"n": 10, "title": "Балық өңдеу цехының қалдығы", "text": "Цех күніне 400 кг балық қалдығын утилизациялайды. Әр 100 кг үшін санитарлық төлем 3 000 тг, рефрижератор көлігі күніне 8 000 тг. Қалдықты балық ұнын өндіруші зауыт тегін алып кетсе, 25 жұмыс күнінде қанша үнемделеді?", "ans": "500 000 теңге"}, {"n": 11, "title": "Наубайхананың қатқан нандары", "text": "Наубайхана күніне 150 кг сатылмай қалған нан өнімдерін кәдеге жаратуға 50 кг үшін 1 000 тг және көлікке 2 000 тг төлейді. Егер нанды құс фабрикасы келісін 40 тг-ден өз көлігімен алып кетсе, 30 күндегі жалпы экономикалық әсер қанша?", "ans": "330 000 теңге"}, {"n": 12, "title": "Ескі автошиналарды кәдеге жарату", "text": "Автопарк айына 40 дана тозған шинаны арнайы полигонға тапсырады. 1 шинаны қабылдау құны — 900 тг, тасымалдау айына 2 рет, әр рейс 10 000 тг. Резеңке ұнтағын жасайтын зауыт шиналарды тегін алып кетсе, 1 жылда (12 ай) қанша теңге үнемделеді?", "ans": "672 000 теңге"}, {"n": 13, "title": "Сыра зауытының бұрдасы", "text": "Зауыт күніне 2 тонна арпа бұрдасын (дробина) полигонға төгуге тоннасына 4 500 тг және көлікке 6 000 тг/күн жұмсайды. Бұрданы ірі қара бордақылау алаңы өз көлігімен тегін әкетсе, 30 күнде қанша үнем болады?", "ans": "450 000 теңге"}, {"n": 14, "title": "Аккумуляторларды тапсыру", "text": "Көлік компаниясы тоқсанына 30 ескі аккумуляторды қауіпті қалдық ретінде утилизациялауға 1 данасына 1 500 тг және арнайы көлікке 15 000 тг төлейтін. Қайта өңдеу зауыты әр аккумуляторды 2 500 тг-ден өз көлігімен сатып алса, 1 жылдағы (4 тоқсан) жалпы тиімділік қанша?", "ans": "540 000 теңге"}, {"n": 15, "title": "Пластик пленка қалдықтары", "text": "Жылыжай кешені маусым соңында 3 000 кг ескі полиэтилен пленкасын полигонға 500 кг үшін 3 000 тг-ден төгіп, көлікке 24 000 тг жұмсайтын. Қайта өңдеушілер пленканы өздері жинап алып, келісіне 50 тг төлесе, кешеннің жалпы пайдасы қанша?", "ans": "192 000 теңге"}, {"n": 16, "title": "Сүт зауытының сарысуы", "text": "Ірімшік цехы күніне 1 000 литр сүт сарысуын кәріз жүйесіне төгу үшін экологиялық айыппұл мен тазарту ақысы ретінде әр 100 литрге 600 тг төлейді. Сарысуды косметика және сусын өндірушілер тегін алып кетсе, 30 күнде қанша қаражат үнемделеді?", "ans": "180 000 теңге"}, {"n": 17, "title": "OBAL PRO алма моделі", "text": "Шаруа күніне 1 000 кг алма жинайды. А нұсқасы: шикізат күйінде 150 тг/кг сату. Ә нұсқасы: өңдеп, 70% таза шырын (400 тг/л), 10% пектин (5 000 тг/кг) және 20% мал азығын (50 тг/кг) алу. Өңдеу шығындарын есептемегенде, Ә нұсқасы күніне қанша теңге қосымша пайда әкеледі?", "ans": "640 000 теңге"}, {"n": 18, "title": "Бидайды терең өңдеу", "text": "Диқан күніне 2 000 кг бидай жинайды. А нұсқасы: элеваторға 90 тг/кг өткізу. Ә нұсқасы: 75% жоғары сұрыпты ұн (220 тг/кг), 20% кебек (60 тг/кг) және 5% бидай ұрығын (800 тг/кг) өндіру. Ә нұсқасы күніне қанша қосымша түсім береді?", "ans": "254 000 теңге"}, {"n": 19, "title": "Пластик бөтелкелердің екінші өмірі", "text": "Цех айына 5 000 кг сұрыпталмаған пластик жинайды. Шикізат күйінде сатса — 80 тг/кг. Жуып-ұсақтаса — 90% таза флекс (250 тг/кг) алынады, 10%-ы қалдық. Жуу мен ұсақтау шығыны айына 150 000 тг болса, өңдеуден түсетін таза қосымша пайда қанша?", "ans": "575 000 теңге"}, {"n": 20, "title": "Күнбағыс дәнін өңдеу", "text": "Фермер 1 000 кг күнбағыс дәнін шикі күйінде 180 тг/кг сата алады. Егер сығымдаса, 40% тазартылған май (650 тг/л), 50% күнжара (110 тг/кг) және 10% қауыз (отын брикеті, 40 тг/кг) алады. Өңдеу шығыны 35 000 тг болса, таза қосымша пайда қанша?", "ans": "104 000 теңге"}, {"n": 21, "title": "Сүтті қалдықсыз өңдеу", "text": "Ферма күніне 500 литр сүтті шикі күйінде 200 тг/л өткізеді. Өңдеу цехында одан 10% сары май (3 500 тг/кг), 15% сүзбе (1 200 тг/кг) және 75% сарысу сусынын (150 тг/л) өндіруге болады. Өңдеу шығыны күніне 25 000 тг болса, қосымша пайда қанша?", "ans": "196 250 теңге"}, {"n": 22, "title": "Қой жүнін терең өңдеу", "text": "Шаруашылық 2 000 кг жуылмаған қой жүнін 100 тг/кг бағамен сата алады. Жуып-тарағаннан кейін 60% таза жүн (700 тг/кг) және 5% ланолин майы (4 000 тг/кг) алынады, 35%-ы шаң-тозаң мен шайыр. Өңдеу шығыны 180 000 тг болса, таза қосымша табыс қанша?", "ans": "860 000 теңге"}, {"n": 23, "title": "Жүгеріні кешенді пайдалану", "text": "3 000 кг жүгері дәнін шикізат ретінде 110 тг/кг сатуға болады. Өңдеу кезінде 65% жүгері ұны (240 тг/кг), 10% жүгері майы (900 тг/л) және 25% мал жемі (70 тг/кг) алынады. Өңдеу шығыны 90 000 тг болса, қосымша пайда қанша?", "ans": "370 500 теңге"}, {"n": 24, "title": "Балықты қалдықсыз бөлу", "text": "1 000 кг жаңа ауланған балықты көтерме бағамен 600 тг/кг сатуға болады. Өңдегенде 55% таза филе (1 600 тг/кг), 5% уылдырық (8 000 тг/кг) және 40% сүйек-бас қалдығынан балық ұны (250 тг/кг) жасалады. Өңдеу шығыны 150 000 тг болса, қосымша пайда қанша?", "ans": "630 000 теңге"}, {"n": 25, "title": "Қарбыздан табиғи сироп", "text": "Бақша шаруашылығы 5 000 кг қарбызды 40 тг/кг сатады. Егер өңдесе, 60% шырыннан қою қарбыз балы — нардек (10% шығым, яғни 500 кг, 1 500 тг/кг) және 30% қабығынан цукат (600 тг/кг) жасалады, 10%-ы дән мен қалдық. Өңдеу шығыны 250 000 тг болса, қосымша пайда қанша?", "ans": "1 200 000 теңге"}, {"n": 26, "title": "Мақта шикізатын өңдеу", "text": "4 000 кг шитті мақтаны 250 тг/кг өткізуге болады. Зауытта өңдегенде 35% таза мақта талшығы (950 тг/кг), 55% мақта тұқымы (120 тг/кг) және 10% линт (мамық, 300 тг/кг) алынады. Өңдеу шығыны 160 000 тг болса, таза қосымша пайда қанша?", "ans": "554 000 теңге"}, {"n": 27, "title": "Ағаш бөренесін қалдықсыз кесу", "text": "10 текше метр (10 м³) бөренені сол күйінде 45 000 тг/м³ сатуға болады. Тіліп өңдегенде 65% құрылыс тақтайы (95 000 тг/м³), 25% қысқа ағаш білеушелер (30 000 тг/м³) және 10% үгіндіден отын брикеті (15 000 тг/м³) шығады. Өңдеу шығыны 75 000 тг болса, қосымша пайда қанша?", "ans": "182 500 теңге"}, {"n": 28, "title": "Қызанақты қайта өңдеу", "text": "2 000 кг қызанақты 180 тг/кг сатуға болады. Өңдеу кезінде 25% қою томат пастасы (1 100 тг/кг), 60% томат шырыны (350 тг/л) алынады, 15%-ы қабық пен дән. Өңдеу шығыны 120 000 тг болса, қосымша пайда қанша?", "ans": "490 000 теңге"}, {"n": 29, "title": "Картопты крахмалға айналдыру", "text": "5 000 кг ұсақ картопты 70 тг/кг сатуға болады. Өңдеу кезінде 18% таза крахмал (650 тг/кг) және 82% мал азығына арналған сығынды (45 тг/ кг) алынады. Өңдеу шығыны 110 000 тг болса, қосымша пайда қанша?", "ans": "309 500 теңге"}, {"n": 30, "title": "Жүзімді қалдықсыз өңдеу", "text": "1 000 кг жүзімді 300 тг/кг сатуға болады. Өңдегенде 70% табиғи шырын (600 тг/л), 5% жүзім сүйегінің майы (6 000 тг/л) және 25% сығындыдан сірке суы (400 тг/л) өндіріледі. Өңдеу шығыны 140 000 тг болса, қосымша пайда қанша?", "ans": "380 000 теңге"}, {"n": 31, "title": "Зығыр дәнінің құндылығы", "text": "1 500 кг зығыр дәнін 220 тг/кг сатуға болады. Сығымдағанда 35% суық сығымдалған зығыр майы (1 400 тг/л) және 65% ақуызды күнжара (180 тг/кг) шығады. Өңдеу шығыны 85 000 тг болса, қосымша пайда қанша?", "ans": "495 500 теңге"}, {"n": 32, "title": "Тауық етін терең бөлшектеу", "text": "1 000 кг тұтас бройлер тауығын көтерме бағамен 1 100 тг/кг сатуға болады. Бөлшектеп өңдегенде 40% төс еті (2 100 тг/кг), 45% сан еті мен қанат (1 300 тг/кг) және 15% сүйек-тері қалдығынан үй жануарларына жем (300 тг/кг) жасалады. Өңдеу шығыны 95 000 тг болса, қосымша пайда қанша?", "ans": "275 000 теңге"}, {"n": 33, "title": "Қарақұмықты өңдеу", "text": "2 000 кг шикі қарақұмықты 160 тг/кг өткізуге болады. Аршып өңдегенде 70% ядрица жармасы (380 тг/кг), 10% ұсақ жарма (200 тг/кг) және 20% қауызынан ортопедиялық жастық толтырғыш (250 тг/кг) жасалады. Өңдеу шығыны 72 000 тг болса, қосымша пайда қанша?", "ans": "280 000 теңге"}, {"n": 34, "title": "Асқабақты қалдықсыз өңдеу", "text": "2 000 кг асқабақты 80 тг/кг сатуға болады. Өңдегенде 75% асқабақ езбесі (пюре, 320 тг/кг) және 10% тазартылған асқабақ дәні (2 200 тг/кг) алынады, 15%-ы қабық. Өңдеу шығыны 130 000 тг болса, қосымша пайда қанша?", "ans": "630 000 теңге"}, {"n": 35, "title": "Климаттық тәуекел және алма бағасы", "text": "Кәсіпкер 1 000 кг алма сатып алмақшы. Құрғақшылық болу ықтималдығы 20% (алма бағасы 250 тг/кг), қолайлы жыл болу ықтималдығы 80% (бағасы 100 тг/кг). Кәсіпкерге 1 000 кг алма алу үшін орташа есеппен қанша бюджет жоспарлау керек?", "ans": "130 000 теңге"}, {"n": 36, "title": "Күн панельдерінің тиімділігі", "text": "Жылыжайға күн панельдері орнатылды. Шуақты ай болу ықтималдығы 70% (айлық үнем 120 000 тг), бұлтты ай болу ықтималдығы 30% (айлық үнем 50 000 тг). 1 жылда (12 ай) орташа есеппен қанша теңге үнемделеді?", "ans": "1 188 000 теңге"}, {"n": 37, "title": "Қызанақ логистикасының тәуекелі", "text": "Кәсіпкер 10 000 кг қызанақты жергілікті базарда 300 тг/кг сата алады (шығынсыз). Көрші қалада баға 450 тг/кг, көлік жалдау — 200 000 тг, бірақ 80% ықтималдықпен өнім 100% аман жетеді, ал 20% ықтималдықпен өнімнің 30%-ы жолда бұзылады. Көрші қалаға апару жергілікті базардан орташа есеппен қанша теңгеге тиімдірек?", "ans": "1 030 000 теңгеге тиімді"}, {"n": 38, "title": "Жел генераторының қуаты", "text": "Фермадағы жел генераторы желді маусымда (ықтималдығы 60%) айына 200 000 тг, ал тымық маусымда (ықтималдығы 40%) айына 80 000 тг электр энергиясын үнемдейді. 6 айлық маусымдағы күтілетін жалпы үнем қанша?", "ans": "912 000 теңге"}, {"n": 39, "title": "Биогаз қондырғысының өнімділігі", "text": "Биогаз реакторы қалыпты режимде (ықтималдығы 85%) айына 300 000 тг табыс әкеледі, ал техникалық ақау болған айда (ықтималдығы 15%) жөндеу шығындарына байланысты 100 000 тг шығын (−100 000 тг) әкеледі. Айлық күтілетін таза табысты табыңыз.", "ans": "240 000 теңге"}, {"n": 40, "title": "Органикалық тыңайтқышқа сұраныс", "text": "Биогумус өндіруші 50 тонна тыңайтқыш дайындады. Мемлекеттік субсидия берілсе (ықтималдығы 40%), тоннасы 90 000 тг-ден сатылады. Субсидия болмаса (ықтималдығы 60%), нарықтық баға 60 000 тг/т болады. Барлық өнімнен күтілетін жалпы түсім қанша?", "ans": "3 600 000 теңге"}, {"n": 41, "title": "Экспорттық келісімшарт тәуекелі", "text": "Бал өндіруші 2 000 кг балды ел ішінде 2 500 тг/кг сата алады. Экспортқа шығарса баға 4 000 тг/кг, сертификаттау мен жеткізу шығыны 1 200 000 тг. Бірақ кедендік тексерістен сәтті өту ықтималдығы 75%, ал 25% ықтималдықпен жүк кері қайтарылып, кәсіпкер тек 1 200 000 тг логистикалық шығынға батады (тауар ел ішінде 2 500 тг/кг бағамен кейін сатылады). Экспорттың күтілетін таза табысы ел ішіндегі сатылымнан қаншаға артық?", "ans": "1 050 000 теңгеге артық"}, {"n": 42, "title": "Қаптама материалының бағасы", "text": "Зауытқа айына 10 000 дана эко-қаптама керек. Қағаз шикізаты тұрақты болса (ықтималдығы 70%), 1 қаптама 45 тг тұрады. Шикізат тапшылығы болса (ықтималдығы 30%), баға 65 тг-ге өседі. Айлық қаптама бюджетінің күтілетін мәнін есептеңіз.", "ans": "510 000 теңге"}, {"n": 43, "title": "Жаңбыр суын жинау жүйесі", "text": "Бау-бақша шаруашылығы жаңбыр суын жинайтын резервуар орнатты. Жауынды жазда (ықтималдығы 35%) суару суынан 400 000 тг, қалыпты жазда (ықтималдығы 45%) 220 000 тг, құрғақ жазда (ықтималдығы 20%) 60 000 тг үнемделеді. Маусымдық күтілетін үнем қанша?", "ans": "251 000 теңге"}, {"n": 44, "title": "Пластик түйіршіктерінің нарықтық бағасы", "text": "Қайта өңдеу цехы 20 тонна екінші реттік полиэтилен түйіршігін өндірді. Мұнай бағасы өссе (ықтималдығы 50%), 1 тонна түйіршік 420 000 тг, тұрақты болса (ықтималдығы 30%) 350 000 тг, төмендесе (ықтималдығы 20%) 280 000 тг тұрады. 20 тонна өнімнің күтілетін құнын табыңыз.", "ans": "7 420 000 теңге"}, {"n": 45, "title": "Ауыл шаруашылығын сақтандыру шешімі", "text": "Егіншінің 10 000 000 тг-лік егіні бар. Бұршақ жауып, егіннің 50%-ын жою ықтималдығы 10%. Сақтандыру полисінің құны — 350 000 тг (сақтандыру шығынды толық өтейді). Сақтандырусыз күтілетін шығын мен полис бағасының айырмасы қанша (сақтандыру алу тиімді ме)?", "ans": "150 000 теңге үнем (тиімді)"}, {"n": 46, "title": "Жылыжайдағы жылыту шығыны", "text": "Қысқы жылыжайдың жылыту шығыны ауа температурасына тәуелді. Жылы қыста (ықтималдығы 25%) айлық газ шығыны 300 000 тг, қалыпты қыста (ықтималдығы 55%) 500 000 тг, қатты аязды қыста (ықтималдығы 20%) 850 000 тг. 3 айлық қысқа жоспарланатын күтілетін бюджет қанша?", "ans": "1 560 000 теңге"}, {"n": 47, "title": "Эко-стартапқа инвестиция тарту", "text": "Жас кәсіпкер жаңа эко-қаптама жобасына 2 000 000 тг салды. Жоба нарықта сәтті өтсе (ықтималдығы 40%), таза пайда 6 000 000 тг болады. Орташа деңгейде жүрсе (ықтималдығы 40%), таза пайда 1 500 000 тг. Сәтсіз болса (ықтималдығы 20%), салынған 2 000 000 тг толық күйеді (−2 000 000 тг). Жобаның күтілетін таза табысын (EMV) есептеңіз.", "ans": "2 600 000 теңге"}, {"n": 48, "title": "Құс фабрикасының жем қоры", "text": "Құс фабрикасына 100 тонна жем керек. Қазір сатып алса, бағасы 110 000 тг/т, бірақ қоймада сақтау шығыны тоннасына 10 000 тг. Егер күзде сатып алса, жақсы өнім болғанда (ықтималдығы 65%) баға 95 000 тг/т, ал нашар өнім болғанда (ықтималдығы 35%) 155 000 тг/т болады. Күзде сатып алудың күтілетін шығыны қазір сатып алудан қанша теңгеге арзан?", "ans": "400 000 теңгеге арзан"}, {"n": 49, "title": "Су тазарту сүзгілерін ауыстыру", "text": "Зауыттың су тазарту сүзгісі қалыпты жағдайда (ықтималдығы 80%) 6 айға жетеді (жылдық шығын 2 ауыстыру × 150 000 тг = 300 000 тг). Егер су қатты ластанса (ықтималдығы 20%), сүзгіні жылына 4 рет ауыстыруға тура келеді (жылдық шығын 600 000 тг). Жылдық күтілетін сүзгі шығыны қанша?", "ans": "360 000 теңге"}, {"n": 50, "title": "Кешенді OBAL PRO таңдауы", "text": "Кәсіпкер 5 000 кг жемісті шикі күйінде 120 тг/кг сата алады. Немесе өңдеу желісін іске қосады: өңдеу шығыны 250 000 тг. Нарықта эко-өнімге жоғары сұраныс болса (ықтималдығы 70%), өңделген өнімдер 1 200 000 тг-ге сатылады. Сұраныс төмен болса (ықтималдығы 30%), 750 000 тг-ге өтеді. Өңдеу желісінің күтілетін таза табысы шикізат сатудан қанша теңгеге артық?", "ans": "215 000 теңгеге артық"}];

 <button class="btn" id="tgo">Сынақты бастау</button>${T&&T.res?`<p class="muted">Соңғы нәтиже: ${T.res}</p>`:''}</div>`;
 ['#tsec','#tcnt'].forEach(id=>$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 $('#tgo').onclick=()=>{const sec=+$('#tsec [aria-pressed=true]').dataset.v,c=+$('#tcnt [aria-pressed=true]').dataset.v;
  let pool=RAW.map(r=>r.n).filter(n=>!sec||P[n].sec===sec);pool.sort(()=>Math.random()-.5);T={q:pool.slice(0,c),i:0,a:[]};testQ()}}
function testQ(){if(T.i>=T.q.length)return testEnd();const n=T.q[T.i],o=P[n];
 V.innerHTML=`<div class="card" style="max-width:860px"><div class="kick"><span class="pill">Сынақ · ${T.i+1}/${T.q.length}</span><span>${SEC[o.sec][0]}</span></div><div class="prog"><i style="width:${T.i/T.q.length*100}%"></i></div>
 <h2>${n}-есеп. ${o.title}</h2><p class="text">${hl(o.text)}</p><div class="ask"><input class="ans" id="in" inputmode="decimal" autocomplete="off" aria-label="Жауап"><span>теңге</span><button class="btn" id="ta">Жауап беру</button><button class="btn ghost" id="tskip">Өткізіп жіберу</button></div><div id="fb"></div></div>`;
 const inp=$('#in');inp.focus();const ans=v=>{T.a.push({n,v});T.i++;testQ()};
 $('#ta').onclick=()=>{const v=parseNum(inp.value);if(v===null){$('#fb').innerHTML='<div class="fb no">Санды жаз немесе «Өткізіп жіберу» бас.</div>';return}ans(v)};
 inp.onkeydown=e=>{if(e.key==='Enter')$('#ta').click()};$('#tskip').onclick=()=>ans(null)}
function testEnd(){let ok=0;const rows=T.a.map(({n,v})=>{const o=P[n],good=v!==null&&eq(v,o.fin);let d='';
  if(good){ok++;const x=st(n);x.stars=Math.max(x.stars,3);S.E.forEach(e=>{if(e.n===n)e.fixed=true})}
  else{const dd=v===null?{m:'Жауап берілмеді.',c:'other'}:diag(n,v);d=dd.m;logErr(n,v,dd)}
  return`<tr><td>${n}</td><td class="r">${v===null?'—':fmt(v)}</td><td class="r">${fmt(o.fin)}</td><td>${good?'<span class="fx" style="color:var(--g);font-weight:600">Дұрыс</span>':`<span class="w" style="color:var(--red)">${d}</span>`}</td></tr>`}).join('');
 save();head();const p=Math.round(ok/T.a.length*100);T.res=`${ok}/${T.a.length} (${p}%)`;T.q=null;
 V.innerHTML=`<div class="card"><h2>Сынақ нәтижесі</h2><div class="big">${ok} / ${T.a.length}</div><p class="text">${p>=85?'Өте жақсы! Есептеу логикасын жақсы меңгергенсің.':p>=60?'Жақсы. Қателерді талдап, қайта шеш.':'Формулаларды қайталап, қателерді «Қадаммен шешу» режимінде түзет.'}</p>
 <div class="scroll"><table><tr><th>Есеп</th><th class="r">Сенің жауабың</th><th class="r">Дұрыс жауап</th><th>Талдау</th></tr>${rows}</table></div>
 <div class="ask"><button class="btn" id="toE">Қатемен жұмысқа өту</button><button class="btn ghost" id="again">Жаңа сынақ</button></div></div>`;
 $('#toE').onclick=()=>setTab('errors');$('#again').onclick=()=>renderTest()}
/* ---------- формулалар ---------- */
function renderFormulas(){const F=[[1,'Қалдықты кәдеге жаратудың үнемі','Үнем = (көлем ÷ тарифтік бірлік × тариф + көлік) × кезең','Егер қалдықты сатса: Тиімділік = (үнем + сату табысы) × кезең',1,['Тариф «әр 100 кг үшін» болса – көлемді 100-ге бөл','Көлік шығыны да үнемге кіреді','Соңында кезеңге (күн, апта, ай) көбейт']],
 [2,'Қалдықсыз өндірістің қосымша пайдасы','Қосымша пайда = Σ(көлем × үлес × баға) − өңдеу шығыны − шикізат түсімі','Шикізат түсімі = көлем × шикізат бағасы',21,['Әр өнімнің шығымын бөлек тап: көлем × үлес','Өңдеу шығынын бір рет қана шегер','Соңында шикізат күйінде сатумен салыстыр']],
 [3,'Тәуекел және күтілетін мән','E(X) = p₁·x₁ + p₂·x₂ + p₃·x₃','p – ықтималдық (0,2 = 20%), x – сценарийдегі баға немесе табыс',37,['Қарапайым орташа емес – әр мәнді ықтималдығына көбейт','Шығын – теріс сан: 0,15 × (−100 000)','«Қаншаға тиімді» десе – балама нұсқамен айырманы тап']]];
 V.innerHTML=`<div class="cols">${F.map(([s,t,f1,f2,ex,tips])=>`<div class="card"><img class="cover" src="img/sec${s}.jpg" alt="${SEC[s][1]}"><div class="kick"><span class="pill">${SEC[s][0]}</span></div><h2>${t}</h2><div class="formula">${f1}</div><p class="muted" style="margin:0">${f2}</p>
 <h3 style="margin:16px 0 4px">Мұқият бол</h3><ul style="margin:0;padding-left:20px">${tips.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3 style="margin:16px 0 4px">Үлгі: ${ex}-есеп</h3>${solHTML(P[ex])}<div class="ask"><button class="btn ghost" data-ex="${ex}">Осы бөлімнің есептеріне өту</button></div></div>`).join('')}</div>`;
 V.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{mode='steps';go(+b.dataset.ex===1?1:+b.dataset.ex===21?17:35)})}
/* ---------- қойындылар ---------- */
function setTab(v){tab=v;$('#tabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
 ({tasks:renderTasks,errors:renderErrors,test:renderTest,formulas:renderFormulas})[v]();head()}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.v)};
/* ---------- калькулятор ---------- */
const cin=$('#cin'),cres=$('#cres');
const calc=()=>{let s=cin.value.replace(/\s/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/%/g,'/100');
 if(!s){cres.textContent='';return}if(!/^[\d.+\-*/()]+$/.test(s)){cres.textContent='?';return}
 try{const r=Function('"use strict";return('+s+')')();cres.textContent=Number.isFinite(r)?'= '+fmt(r):'?'}catch(e){cres.textContent='…'}};
cin.oninput=calc;
$('#calc .keys').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
 if(k==='C')cin.value='';else if(k==='⌫')cin.value=cin.value.slice(0,-1);else if(k==='=')
 {calc();const r=cres.textContent.replace('= ','').replace(/\s/g,'').replace('−','-').replace(',','.');if(/^-?[\d.]+$/.test(r))cin.value=r}else cin.value+=k;calc()};
$('#calcBtn').onclick=()=>{const c=$('#calc'),o=c.classList.toggle('open');$('#calcBtn').setAttribute('aria-expanded',o);if(o)cin.focus()};
setTab('tasks');
}
</script>
</body>
